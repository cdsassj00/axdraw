name: Deploy to GitHub Pages

# Publishes the built app to GitHub Pages.
#
# Listening on every branch and gating the jobs on the default branch keeps this
# working whatever the default branch is called — pinning the trigger to
# [main, master] silently deploys nothing on a repository named otherwise.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment that is already publishing; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          # The deploy job never runs the browser tests, so skip the ~300 MB
          # browser download that playwright's postinstall would otherwise do.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          # Project sites are served from /<repository-name>/, user and org
          # sites (a repo named <owner>.github.io) from /. Worked out from the
          # repository name rather than actions/configure-pages, whose
          # enablement option needs admin rights the default GITHUB_TOKEN does
          # not have — it fails the build with "Resource not accessible by
          # integration" instead of turning Pages on.
          VITE_BASE: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
