# Deploys the Worker (app + share API + collab rooms) to Cloudflare on every
# push to the default branch — once a CLOUDFLARE_API_TOKEN secret exists.
#
# One-time setup: create an API token at
# https://dash.cloudflare.com/profile/api-tokens with the "Edit Cloudflare
# Workers" template (add Workers KV Storage: Edit), then save it in the repo
# under Settings → Secrets and variables → Actions → New repository secret,
# named CLOUDFLARE_API_TOKEN. Until then this workflow skips itself quietly.
name: Deploy to Cloudflare

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for the Cloudflare token
        id: token
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Build
        if: steps.token.outputs.present == 'true'
        run: |
          npm ci
          npm run build

      - name: Deploy Worker
        if: steps.token.outputs.present == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
