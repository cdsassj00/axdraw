# Cloudflare deployment: the Worker serves both the built app (dist/) and the
# share API. One-time setup, then `npm run deploy` does everything:
#
#   npx wrangler login
#   npx wrangler kv namespace create SCENES   # paste the printed id below
#   npm run deploy
#
name = "axdraw"
main = "worker/index.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "SCENES"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Live-collaboration rooms. No extra setup — the migration below creates the
# class on first deploy.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
