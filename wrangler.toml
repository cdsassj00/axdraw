# Cloudflare deployment: the Worker serves both the built app (dist/) and the
# share API. The KV namespace below already exists; deploying is:
#
#   npx wrangler login
#   npm run deploy
#
name = "axdraw"
main = "worker/index.js"
# Dashboard-added variables (e.g. GROQ_API_KEY) survive CI deploys.
keep_vars = true
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "SCENES"
id = "261bee1a18784ee881e372399b7408eb"

# Live-collaboration rooms. No extra setup — the migration below creates the
# class on first deploy.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Room scenes. R2 rather than KV: KV is eventually consistent (measured at
# ~40s in production), and a room read back inside that window looks empty —
# draw once and the save overwrites the real scene. R2 is read-after-write
# consistent, so that window does not exist. The Worker falls back to KV when
# this binding is absent, so removing it degrades rather than breaks.
[[r2_buckets]]
binding = "ROOM_SCENES"
bucket_name = "axdraw-rooms"

# Cloud canvases (email-gated, free): canvas list, consent records and leads
# live in D1; the encrypted drawings go to the R2 bucket above. Until this
# block existed, the app kept working and the cloud button said the server
# had not switched it on yet. One-time setup (done 2026-10-07):
#
#   npx wrangler d1 create axdraw-db
#
# then paste the printed database_id below. Tables create themselves. The
# binding must be named DB — that is what worker/index.js reads — whatever
# name wrangler's own snippet suggests.
[[d1_databases]]
binding = "DB"
database_name = "axdraw-db"
database_id = "ccb7b1b0-7b49-43a0-95b9-abf6fde00d8f"
